  var PIXELS_PER_SEC = 30;

  function marquee(container) {
    if (container.dataset.marqueeBound) return;

    var track = container.querySelector(".card-tags-track");
    if (!track) return;

    var originalWidth = track.scrollWidth;
    if (originalWidth <= container.clientWidth + 1) return;

    container.dataset.marqueeBound = "1";

    
    var originalChildren = [].slice.call(track.children);
    originalChildren.forEach(function (child) {
      var dup = child.cloneNode(true);

    });

    var gap = parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap || 0) || 0;
    var loopWidth = originalWidth + gap;

    var paused = false;
    var offset = 0;
    var last = null;

    container.addEventListener("mouseenter", function () { paused = true; });
    container.addEventListener("mouseleave", function () { paused = false; });
    container.addEventListener("touchstart", function () { paused = true; }, { passive: true });
    container.addEventListener("touchend", function () { paused = false; });

    function step(ts) {
      if (last === null) last = ts;
      var dt = ts - last;
      last = ts;

      if (!paused) {
        offset += (PIXELS_PER_SEC * dt) / 1000;
        if (offset >= loopWidth) {
          offset -= loopWidth;
        }
        track.style.transform = "translateX(" + -offset + "px)";
      }

      requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
  }
